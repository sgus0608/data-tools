<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bumper Car Arena</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: #f8fafc;
      background:
        radial-gradient(circle at top left, rgba(56,189,248,.22), transparent 30%),
        radial-gradient(circle at bottom right, rgba(244,114,182,.22), transparent 34%),
        linear-gradient(135deg, #020617, #0f172a);
      overflow-x: hidden;
    }
    .shell {
      display: grid;
      grid-template-columns: 280px 760px 280px;
      gap: 22px;
      padding: 24px;
      border-radius: 30px;
      background: rgba(2,6,23,.72);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 30px 90px rgba(0,0,0,.45);
      backdrop-filter: blur(18px);
    }
    .panel { display: flex; flex-direction: column; gap: 14px; }
    .card {
      padding: 16px;
      border-radius: 20px;
      background: rgba(15,23,42,.9);
      border: 1px solid rgba(255,255,255,.08);
    }
    h1 { margin: 0; font-size: 32px; line-height: 1.05; letter-spacing: 1px; }
    .subtitle { margin: 10px 0 0; color: #94a3b8; font-size: 14px; line-height: 1.55; }
    canvas {
      display: block;
      width: 760px;
      height: 760px;
      border-radius: 28px;
      background: #020617;
      border: 2px solid rgba(148,163,184,.2);
    }
    .arena-wrap { position: relative; }
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: 28px;
      background: rgba(2,6,23,.82);
      padding: 32px;
      z-index: 10;
    }
    .overlay.hidden { display: none; }
    .overlay-box {
      width: min(420px, 100%);
      padding: 24px;
      border-radius: 24px;
      background: rgba(15,23,42,.92);
      border: 1px solid rgba(255,255,255,.1);
    }
    .overlay h2 { margin: 0 0 14px; font-size: 34px; }
    .overlay p { margin: 0 0 18px; color: #cbd5e1; line-height: 1.7; font-size: 14px; }
    input, button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 13px 14px;
      font-size: 15px;
      font-weight: 800;
      outline: none;
    }
    input {
      margin-bottom: 10px;
      color: #f8fafc;
      background: rgba(2,6,23,.9);
      border: 1px solid rgba(148,163,184,.25);
    }
    button {
      cursor: pointer;
      color: #082f49;
      background: linear-gradient(135deg, #38bdf8, #22d3ee);
      transition: .18s;
    }
    button.secondary {
      color: #e2e8f0;
      background: rgba(51,65,85,.94);
      border: 1px solid rgba(255,255,255,.08);
    }
    button:hover { transform: translateY(-1px); filter: brightness(1.08); }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid rgba(148,163,184,.12);
      font-size: 14px;
      color: #cbd5e1;
    }
    .row:last-child { border-bottom: none; }
    .player-name {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      color: #f8fafc;
      min-width: 0;
    }
    .nickname {
      max-width: 145px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .dot { width: 11px; height: 11px; border-radius: 999px; display: inline-block; flex: 0 0 auto; }
    .value { font-weight: 900; color: #38bdf8; font-variant-numeric: tabular-nums; }
    .controls { font-size: 13px; color: #cbd5e1; line-height: 1.9; }
    .controls strong { color: #fff; }
    .message { min-height: 34px; color: #bae6fd; font-size: 13px; line-height: 1.6; }
    .tip { color: #94a3b8; font-size: 12px; line-height: 1.7; }
    @media (max-width: 1380px) {
      body { align-items: flex-start; padding: 16px; }
      .shell { grid-template-columns: 1fr; justify-items: center; }
      .panel { width: min(760px, 100%); }
    }
    @media (max-width: 820px) {
      canvas { width: 92vw; height: 92vw; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <aside class="panel">
      <div class="card">
        <h1>BUMPER<br />ARENA</h1>
        <p class="subtitle">조작감 개선판입니다. 속도가 있을 때 자연스럽게 회전하고, 브레이크로 드리프트를 줄입니다.</p>
      </div>

      <div class="card controls">
        <div><strong>W</strong> : 전진</div>
        <div><strong>S</strong> : 후진</div>
        <div><strong>A / D</strong> : 좌우 조향</div>
        <div><strong>Shift</strong> : 부스터</div>
        <div><strong>Space</strong> : 브레이크</div>
      </div>

      <div class="card">
        <div class="row"><span>라운드</span><span id="round" class="value">1</span></div>
        <div class="row"><span>남은 유저</span><span id="aliveCount" class="value">0</span></div>
        <div class="row"><span>상태</span><span id="gameStatus" class="value">대기</span></div>
      </div>

      <div class="card tip">차량이 너무 미끄럽거나 느리면 server.js의 engineForce, sideGrip, maxSpeed 값을 조정하면 됩니다.</div>
    </aside>

    <section class="arena-wrap">
      <canvas id="gameCanvas" width="760" height="760"></canvas>

      <div id="joinOverlay" class="overlay">
        <div class="overlay-box">
          <h2>입장하기</h2>
          <p>닉네임을 입력하고 같은 링크로 접속한 사람들과 대결하세요.</p>
          <input id="nicknameInput" maxlength="12" placeholder="닉네임 입력" />
          <button id="joinButton">방 입장</button>
        </div>
      </div>

      <div id="messageOverlay" class="overlay hidden">
        <div class="overlay-box">
          <h2 id="messageTitle">WAITING</h2>
          <p id="messageText">다른 사용자를 기다리는 중입니다.</p>
        </div>
      </div>
    </section>

    <aside class="panel">
      <div class="card"><div id="playerList"></div></div>
      <div class="card"><div class="message" id="systemMessage">서버에 접속 중...</div></div>
      <button id="restartButton" class="secondary">라운드 재시작</button>
    </aside>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const joinOverlay = document.getElementById("joinOverlay");
    const messageOverlay = document.getElementById("messageOverlay");
    const messageTitle = document.getElementById("messageTitle");
    const messageText = document.getElementById("messageText");

    const nicknameInput = document.getElementById("nicknameInput");
    const joinButton = document.getElementById("joinButton");
    const restartButton = document.getElementById("restartButton");

    const playerList = document.getElementById("playerList");
    const systemMessage = document.getElementById("systemMessage");
    const roundEl = document.getElementById("round");
    const aliveCountEl = document.getElementById("aliveCount");
    const gameStatusEl = document.getElementById("gameStatus");

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;
    const CENTER = { x: WIDTH / 2, y: HEIGHT / 2 };
    const ARENA_RADIUS = 315;

    let myId = null;
    let latestState = { players: {}, round: 1, isGameRunning: false, aliveCount: 0 };
    const renderPlayers = {};
    const keys = new Set();

    function joinGame() {
      const nickname = nicknameInput.value.trim();

      if (!nickname) {
        alert("닉네임을 입력해주세요.");
        return;
      }

      socket.emit("join", nickname);
      joinOverlay.classList.add("hidden");
    }

    joinButton.addEventListener("click", joinGame);
    nicknameInput.addEventListener("keydown", e => {
      if (e.key === "Enter") joinGame();
    });

    restartButton.addEventListener("click", () => socket.emit("restart"));

    socket.on("connect", () => systemMessage.textContent = "서버에 연결되었습니다.");
    socket.on("joined", data => {
      myId = data.id;
      systemMessage.textContent = "방에 입장했습니다.";
    });
    socket.on("system", message => systemMessage.textContent = message);

    socket.on("roundEnd", data => {
      messageTitle.textContent = data.winner === "DRAW" ? "DRAW!" : `${data.winner} WINS!`;
      messageText.textContent = "잠시 후 다음 라운드가 시작됩니다.";
      messageOverlay.classList.remove("hidden");
    });

    socket.on("state", state => {
      latestState = state;
      syncRenderPlayers(state.players);
      updateHud();

      if (myId && Object.keys(state.players).length < 2) {
        messageTitle.textContent = "WAITING";
        messageText.textContent = "최소 2명 이상 접속하면 게임이 시작됩니다.";
        messageOverlay.classList.remove("hidden");
      } else if (state.isGameRunning) {
        messageOverlay.classList.add("hidden");
      }
    });

    function syncRenderPlayers(players) {
      Object.values(players).forEach(p => {
        if (!renderPlayers[p.id]) {
          renderPlayers[p.id] = { ...p, targetX: p.x, targetY: p.y, targetAngle: p.angle };
        } else {
          renderPlayers[p.id].targetX = p.x;
          renderPlayers[p.id].targetY = p.y;
          renderPlayers[p.id].targetAngle = p.angle;
          renderPlayers[p.id].nickname = p.nickname;
          renderPlayers[p.id].color = p.color;
          renderPlayers[p.id].alive = p.alive;
          renderPlayers[p.id].score = p.score;
          renderPlayers[p.id].boost = p.boost;
        }
      });

      Object.keys(renderPlayers).forEach(id => {
        if (!players[id]) delete renderPlayers[id];
      });
    }

    function updateRenderPlayers() {
      Object.values(renderPlayers).forEach(p => {
        p.x += (p.targetX - p.x) * 0.35;
        p.y += (p.targetY - p.y) * 0.35;

        let diff = p.targetAngle - p.angle;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;

        p.angle += diff * 0.35;
      });
    }

    function updateHud() {
      roundEl.textContent = latestState.round;
      aliveCountEl.textContent = latestState.aliveCount;
      gameStatusEl.textContent = latestState.isGameRunning ? "진행중" : "대기";

      const players = Object.values(latestState.players).sort((a, b) => b.score - a.score);

      if (!players.length) {
        playerList.innerHTML = `<div class="row"><span>접속 유저 없음</span><span class="value">0</span></div>`;
        return;
      }

      playerList.innerHTML = players.map(p => `
        <div class="row">
          <span class="player-name">
            <span class="dot" style="background:${p.color}"></span>
            <span class="nickname">${escapeHtml(p.nickname)}${p.id === myId ? " (나)" : ""}</span>
          </span>
          <span class="value">${p.alive ? p.score : "OUT"}</span>
        </div>
      `).join("");
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function sendInput() {
      socket.emit("input", {
        up: keys.has("w") || keys.has("W") || keys.has("ArrowUp"),
        down: keys.has("s") || keys.has("S") || keys.has("ArrowDown"),
        left: keys.has("a") || keys.has("A") || keys.has("ArrowLeft"),
        right: keys.has("d") || keys.has("D") || keys.has("ArrowRight"),
        boost: keys.has("Shift"),
        brake: keys.has(" ")
      });
    }

    setInterval(sendInput, 1000 / 60);

    document.addEventListener("keydown", event => {
      if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.code)) {
        event.preventDefault();
      }
      keys.add(event.key === " " ? " " : event.key);
    });

    document.addEventListener("keyup", event => {
      keys.delete(event.key === " " ? " " : event.key);
    });

    window.addEventListener("blur", () => keys.clear());

    function drawArena() {
      ctx.clearRect(0, 0, WIDTH, HEIGHT);

      const gradient = ctx.createRadialGradient(CENTER.x, CENTER.y, 30, CENTER.x, CENTER.y, 360);
      gradient.addColorStop(0, "#1e293b");
      gradient.addColorStop(0.75, "#0f172a");
      gradient.addColorStop(1, "#020617");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      ctx.save();
      ctx.translate(CENTER.x, CENTER.y);

      ctx.beginPath();
      ctx.arc(0, 0, ARENA_RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = "#334155";
      ctx.fill();

      ctx.lineWidth = 12;
      ctx.strokeStyle = "#64748b";
      ctx.stroke();

      ctx.lineWidth = 4;
      ctx.strokeStyle = "rgba(248,250,252,.3)";
      ctx.stroke();

      for (let r = 80; r < ARENA_RADIUS; r += 80) {
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(148,163,184,.13)";
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      ctx.restore();
    }

    function roundRect(x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function drawCar(p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);
      ctx.globalAlpha = p.alive ? 1 : 0.22;

      ctx.shadowColor = p.color;
      ctx.shadowBlur = p.alive ? 16 : 0;

      ctx.fillStyle = p.color;
      roundRect(-32, -21, 64, 42, 10);
      ctx.fill();

      ctx.shadowBlur = 0;

      ctx.fillStyle = "rgba(15,23,42,.76)";
      roundRect(-9, -16, 24, 32, 8);
      ctx.fill();

      ctx.fillStyle = "rgba(255,255,255,.92)";
      ctx.fillRect(22, -15, 4, 8);
      ctx.fillRect(22, 7, 4, 8);

      ctx.fillStyle = "#020617";
      ctx.fillRect(-24, -25, 15, 7);
      ctx.fillRect(9, -25, 15, 7);
      ctx.fillRect(-24, 18, 15, 7);
      ctx.fillRect(9, 18, 15, 7);

      ctx.restore();

      ctx.save();
      ctx.textAlign = "center";
      ctx.font = p.id === myId ? "bold 14px Arial" : "bold 12px Arial";
      ctx.fillStyle = p.id === myId ? "#ffffff" : "#e2e8f0";
      ctx.fillText(p.nickname, p.x, p.y - 42);

      if (p.id === myId && p.alive) {
        ctx.fillStyle = "rgba(15,23,42,.75)";
        ctx.fillRect(p.x - 28, p.y + 39, 56, 7);
        ctx.fillStyle = "#38bdf8";
        ctx.fillRect(p.x - 28, p.y + 39, 56 * (p.boost / 100), 7);
      }

      if (!p.alive) {
        ctx.font = "bold 12px Arial";
        ctx.fillStyle = "#fb7185";
        ctx.fillText("OUT", p.x, p.y + 44);
      }

      ctx.restore();
    }

    function draw() {
      updateRenderPlayers();
      drawArena();
      Object.values(renderPlayers).forEach(drawCar);
      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
