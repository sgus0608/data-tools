
<style>
  :root { --accent: #1D9E75; --accent-light: #E1F5EE; --accent-dark: #0F6E56; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); }
  #app { padding: 1.5rem 0; max-width: 600px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 6px; }
  .subtitle { font-size: 14px; color: var(--color-text-secondary); margin-bottom: 1.5rem; }
  .drop-zone {
    border: 1.5px dashed var(--color-border-secondary);
    border-radius: var(--border-radius-lg);
    padding: 2.5rem 1.5rem;
    text-align: center;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    background: var(--color-background-secondary);
    position: relative;
  }
  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--accent);
    background: var(--accent-light);
  }
  .drop-zone input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%;
  }
  .drop-icon {
    width: 40px; height: 40px; margin: 0 auto 12px;
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-md);
    display: flex; align-items: center; justify-content: center;
  }
  .drop-icon svg { width: 20px; height: 20px; color: var(--accent); }
  .drop-label { font-size: 15px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 4px; }
  .drop-hint { font-size: 13px; color: var(--color-text-secondary); }
  .file-card {
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-lg);
    padding: 1rem 1.25rem;
    display: flex; align-items: center; gap: 12px;
    margin-top: 1rem;
  }
  .file-icon {
    width: 40px; height: 40px; flex-shrink: 0;
    background: #EAF3DE; border-radius: var(--border-radius-md);
    display: flex; align-items: center; justify-content: center;
  }
  .file-name { font-size: 14px; font-weight: 500; color: var(--color-text-primary); }
  .file-size { font-size: 12px; color: var(--color-text-secondary); margin-top: 2px; }
  .remove-btn {
    margin-left: auto; background: none; border: none; cursor: pointer;
    color: var(--color-text-secondary); padding: 4px; line-height: 1;
    border-radius: 4px;
  }
  .remove-btn:hover { color: #E24B4A; background: #FCEBEB; }
  .options {
    margin-top: 1.25rem;
    background: var(--color-background-secondary);
    border-radius: var(--border-radius-md);
    padding: 1rem 1.25rem;
  }
  .options-title { font-size: 13px; font-weight: 500; color: var(--color-text-secondary); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
  .option-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .option-row:last-child { margin-bottom: 0; }
  .option-row input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
  .option-row label { font-size: 14px; color: var(--color-text-primary); cursor: pointer; }
  .option-row label span { font-size: 12px; color: var(--color-text-secondary); display: block; }
  .action-btn {
    width: 100%; margin-top: 1.25rem; padding: 12px;
    background: var(--accent); color: #fff; border: none;
    border-radius: var(--border-radius-md); font-size: 15px; font-weight: 500;
    cursor: pointer; transition: background 0.15s, transform 0.1s;
  }
  .action-btn:hover { background: var(--accent-dark); }
  .action-btn:active { transform: scale(0.99); }
  .action-btn:disabled { background: var(--color-border-secondary); cursor: not-allowed; transform: none; }
  .progress-wrap { margin-top: 1rem; display: none; }
  .progress-bar-bg {
    height: 6px; background: var(--color-background-secondary);
    border-radius: 99px; overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%; width: 0%; background: var(--accent);
    border-radius: 99px; transition: width 0.3s;
  }
  .progress-label { font-size: 13px; color: var(--color-text-secondary); margin-top: 6px; text-align: center; }
  .result-card {
    margin-top: 1rem; padding: 1rem 1.25rem;
    border-radius: var(--border-radius-lg); display: none;
    align-items: center; gap: 12px;
  }
  .result-card.success { background: #EAF3DE; border: 0.5px solid #C0DD97; }
  .result-card.error { background: #FCEBEB; border: 0.5px solid #F7C1C1; }
  .result-text { font-size: 14px; font-weight: 500; }
  .result-card.success .result-text { color: #3B6D11; }
  .result-card.error .result-text { color: #A32D2D; }
  .result-sub { font-size: 12px; margin-top: 3px; }
  .result-card.success .result-sub { color: #639922; }
  .result-card.error .result-sub { color: #993535; }
  .dl-btn {
    margin-left: auto; padding: 7px 14px; background: var(--accent);
    color: #fff; border: none; border-radius: var(--border-radius-md);
    font-size: 13px; font-weight: 500; cursor: pointer; flex-shrink: 0;
    text-decoration: none; display: inline-block;
  }
  .dl-btn:hover { background: var(--accent-dark); }
  .notice {
    margin-top: 1.25rem; padding: 10px 14px;
    background: var(--color-background-secondary);
    border-left: 3px solid var(--color-border-secondary);
    border-radius: 0 var(--border-radius-md) var(--border-radius-md) 0;
    font-size: 12px; color: var(--color-text-secondary); line-height: 1.6;
  }
  .notice strong { color: var(--color-text-primary); font-weight: 500; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 99px;
    font-size: 11px; font-weight: 500; background: #E1F5EE; color: #0F6E56;
    margin-left: 6px;
  }
</style>

<div id="app">
  <h1>엑셀 비밀번호 제거기 <span class="badge">브라우저 전용</span></h1>
  <p class="subtitle">파일을 업로드하면 비밀번호를 제거한 새 파일을 다운로드할 수 있습니다. 파일은 서버로 전송되지 않습니다.</p>

  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept=".xlsx,.xlsm,.xls,.xlsb" />
    <div class="drop-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M12 4v12M8 8l4-4 4 4"/>
      </svg>
    </div>
    <div class="drop-label">파일을 여기에 끌어다 놓거나 클릭하여 선택</div>
    <div class="drop-hint">.xlsx, .xlsm, .xls, .xlsb 지원</div>
  </div>

  <div class="file-card" id="fileCard" style="display:none;">
    <div class="file-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3B6D11" stroke-width="1.5">
        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/>
        <line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/>
      </svg>
    </div>
    <div>
      <div class="file-name" id="fileName">-</div>
      <div class="file-size" id="fileSize">-</div>
    </div>
    <button class="remove-btn" id="removeBtn" title="파일 제거">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <div class="options">
    <div class="options-title">제거할 보호 설정</div>
    <div class="option-row">
      <input type="checkbox" id="opt1" checked />
      <label for="opt1">시트 보호 (Sheet Protection)
        <span>각 시트의 셀 편집 잠금 해제</span>
      </label>
    </div>
    <div class="option-row">
      <input type="checkbox" id="opt2" checked />
      <label for="opt2">통합 문서 보호 (Workbook Structure)
        <span>시트 추가/삭제/이동 잠금 해제</span>
      </label>
    </div>
    <div class="option-row">
      <input type="checkbox" id="opt3" />
      <label for="opt3">VBA 프로젝트 보호
        <span>.xlsm 파일의 매크로 보호 제거 시도</span>
      </label>
    </div>
  </div>

  <button class="action-btn" id="processBtn" disabled>파일을 먼저 선택하세요</button>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">처리 중...</div>
  </div>

  <div class="result-card" id="resultCard">
    <div>
      <div class="result-text" id="resultText"></div>
      <div class="result-sub" id="resultSub"></div>
    </div>
    <a class="dl-btn" id="dlBtn" style="display:none;" download>다운로드</a>
  </div>

  <div class="notice">
    <strong>참고:</strong> 이 도구는 <strong>시트/통합 문서 구조 보호</strong>를 제거합니다. 파일 열기 비밀번호(암호화)는 브라우저에서 제거할 수 없습니다. 파일 열기에 비밀번호가 필요하다면, 먼저 Excel에서 파일을 열고 저장한 다음 사용해 주세요.
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
let selectedFile = null;

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const fileCard = document.getElementById('fileCard');
const fileName = document.getElementById('fileName');
const fileSize = document.getElementById('fileSize');
const removeBtn = document.getElementById('removeBtn');
const processBtn = document.getElementById('processBtn');
const progressWrap = document.getElementById('progressWrap');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
const resultCard = document.getElementById('resultCard');
const resultText = document.getElementById('resultText');
const resultSub = document.getElementById('resultSub');
const dlBtn = document.getElementById('dlBtn');

function formatBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
  return (b/1048576).toFixed(1) + ' MB';
}

function setFile(f) {
  if (!f) return;
  selectedFile = f;
  fileName.textContent = f.name;
  fileSize.textContent = formatBytes(f.size);
  fileCard.style.display = 'flex';
  processBtn.disabled = false;
  processBtn.textContent = '비밀번호 제거 시작';
  resultCard.style.display = 'none';
  dlBtn.style.display = 'none';
}

fileInput.addEventListener('change', e => { if (e.target.files[0]) setFile(e.target.files[0]); });
removeBtn.addEventListener('click', () => {
  selectedFile = null;
  fileCard.style.display = 'none';
  processBtn.disabled = true;
  processBtn.textContent = '파일을 먼저 선택하세요';
  resultCard.style.display = 'none';
  fileInput.value = '';
});
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('drag-over');
  const f = e.dataTransfer.files[0];
  if (f && /\.(xlsx|xlsm|xls|xlsb)$/i.test(f.name)) setFile(f);
});

function setProgress(pct, label) {
  progressFill.style.width = pct + '%';
  progressLabel.textContent = label;
}

function showResult(success, text, sub) {
  resultCard.className = 'result-card ' + (success ? 'success' : 'error');
  resultCard.style.display = 'flex';
  resultText.textContent = text;
  resultSub.textContent = sub;
}

function removeXmlPassword(xmlStr) {
  let changed = false;
  // Remove sheetProtection tag entirely
  let result = xmlStr.replace(/<sheetProtection[^/]*(\/?>|>[\s\S]*?<\/sheetProtection>)/g, () => { changed = true; return ''; });
  // Remove workbookProtection tag
  result = result.replace(/<workbookProtection[^/]*(\/?>|>[\s\S]*?<\/workbookProtection>)/g, () => { changed = true; return ''; });
  // Remove fileSharing
  result = result.replace(/<fileSharing[^/]*(\/?>|>[\s\S]*?<\/fileSharing>)/g, () => { changed = true; return ''; });
  return { result, changed };
}

processBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  const doSheet = document.getElementById('opt1').checked;
  const doWb = document.getElementById('opt2').checked;
  const doVba = document.getElementById('opt3').checked;

  processBtn.disabled = true;
  progressWrap.style.display = 'block';
  resultCard.style.display = 'none';
  dlBtn.style.display = 'none';

  try {
    setProgress(10, '파일 읽는 중...');
    const buf = await selectedFile.arrayBuffer();
    setProgress(30, 'ZIP 구조 분석 중...');
    const zip = await JSZip.loadAsync(buf);
    setProgress(50, '보호 설정 검색 중...');

    let removedCount = 0;
    const files = Object.keys(zip.files);

    for (const path of files) {
      const f = zip.files[path];
      if (f.dir) continue;

      // Process XML files for sheet/workbook protection
      if (path.endsWith('.xml') || path.endsWith('.xml.rels')) {
        const isSheet = path.includes('xl/worksheets/');
        const isWb = path.includes('xl/workbook');
        if ((doSheet && isSheet) || (doWb && isWb)) {
          const xml = await f.async('string');
          const { result, changed } = removeXmlPassword(xml);
          if (changed) {
            zip.file(path, result);
            removedCount++;
          }
        }
        // Also check workbook.xml regardless
        if (path === 'xl/workbook.xml') {
          const xml = await f.async('string');
          const { result, changed } = removeXmlPassword(xml);
          if (changed) { zip.file(path, result); removedCount++; }
        }
      }

      // Remove VBA project password (simple approach: zero out hash bytes)
      if (doVba && path === 'xl/vbaProject.bin') {
        try {
          const binArr = await f.async('uint8array');
          // Find and clear DPB= pattern (VBA project password marker)
          const enc = new TextDecoder('latin1');
          let binStr = enc.decode(binArr);
          if (binStr.includes('DPB="') || binStr.includes('DPB=')) {
            const newBin = binStr.replace(/DPB="[^"]*"/g, 'DPB=""').replace(/DPx="[^"]*"/g, 'DPx=""');
            const enc2 = new TextEncoder();
            zip.file(path, new TextEncoder().encode(newBin));
            removedCount++;
          }
        } catch(e) {}
      }
    }

    setProgress(80, '새 파일 생성 중...');
    const newBlob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
    setProgress(100, '완료!');

    const ext = selectedFile.name.split('.').pop();
    const newName = selectedFile.name.replace(/\.[^.]+$/, '') + '_비밀번호제거.' + ext;
    const url = URL.createObjectURL(newBlob);
    dlBtn.href = url;
    dlBtn.download = newName;
    dlBtn.style.display = 'inline-block';

    if (removedCount > 0) {
      showResult(true, `보호 설정 ${removedCount}개 제거 완료`, `${newName} 준비 완료 — 오른쪽 버튼으로 다운로드하세요`);
    } else {
      showResult(true, '처리 완료 (제거된 보호 없음)', '파일에서 시트/통합 문서 보호 설정을 찾지 못했습니다. 파일 열기 암호는 이 도구로 제거할 수 없습니다.');
      dlBtn.style.display = 'inline-block';
    }
  } catch(err) {
    showResult(false, '처리 실패', '파일 형식이 올바르지 않거나 파일이 손상되었습니다: ' + err.message);
  } finally {
    processBtn.disabled = false;
    processBtn.textContent = '다시 처리하기';
    setTimeout(() => { progressWrap.style.display = 'none'; }, 800);
  }
});
</script>
