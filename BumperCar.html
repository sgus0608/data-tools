
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bumper Arena</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: #f8fafc;
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.2), transparent 30%),
        radial-gradient(circle at bottom right, rgba(244, 114, 182, 0.2), transparent 35%),
        linear-gradient(135deg, #020617, #0f172a);
      overflow: hidden;
    }

    .game-shell {
      display: grid;
      grid-template-columns: 260px 760px 260px;
      gap: 22px;
      padding: 24px;
      border-radius: 30px;
      background: rgba(2, 6, 23, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(18px);
    }

    .panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      padding: 16px;
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.05;
      letter-spacing: 1px;
    }

    .subtitle {
      margin: 10px 0 0;
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
    }

    canvas {
      display: block;
      width: 760px;
      height: 760px;
      border-radius: 28px;
      background: #020617;
      border: 2px solid rgba(148, 163, 184, 0.2);
    }

    .arena-wrap {
      position: relative;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: 28px;
      background: rgba(2, 6, 23, 0.78);
      padding: 32px;
      z-index: 5;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay h2 {
      margin: 0 0 12px;
      font-size: 42px;
      letter-spacing: 2px;
    }

    .overlay p {
      margin: 0;
      color: #cbd5e1;
      font-size: 15px;
      line-height: 1.8;
    }

    button,
    select {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 13px 14px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.18s ease;
    }

    button {
      color: #082f49;
      background: linear-gradient(135deg, #38bdf8, #22d3ee);
    }

    button.secondary {
      color: #e2e8f0;
      background: rgba(51, 65, 85, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    button:hover,
    select:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    select {
      color: #e2e8f0;
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid rgba(148, 163, 184, 0.25);
      outline: none;
    }

    .score-row,
    .stat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      font-size: 14px;
      color: #cbd5e1;
    }

    .score-row:last-child,
    .stat-row:last-child {
      border-bottom: none;
    }

    .player-name {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      color: #f8fafc;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 999px;
      display: inline-block;
    }

    .value {
      font-weight: 900;
      color: #38bdf8;
      font-variant-numeric: tabular-nums;
    }

    .controls {
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.9;
    }

    .controls strong {
      color: #fff;
    }

    .tag {
      display: inline-flex;
      width: fit-content;
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      color: #bae6fd;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.18);
    }

    @media (max-width: 1320px) {
      body {
        overflow: auto;
        padding: 16px;
      }

      .game-shell {
        grid-template-columns: 1fr;
        justify-items: center;
      }

      .panel {
        width: min(760px, 100%);
      }
    }

    @media (max-width: 820px) {
      canvas {
        width: 92vw;
        height: 92vw;
      }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <aside class="panel">
      <div class="card">
        <h1>BUMPER<br />ARENA</h1>
        <p class="subtitle">4대의 차량이 아레나에서 서로 밀쳐내는 배틀 게임입니다. 밖으로 떨어지면 탈락!</p>
      </div>

      <div class="card controls">
        <div><strong>W</strong> : 전진</div>
        <div><strong>S</strong> : 후진</div>
        <div><strong>A / D</strong> : 좌우 회전</div>
        <div><strong>Shift</strong> : 순간 부스터</div>
        <div><strong>Space</strong> : 핸드브레이크</div>
        <div><strong>P</strong> : 일시정지</div>
      </div>

      <div class="card">
        <div class="stat-row"><span>라운드</span><span id="round" class="value">1</span></div>
        <div class="stat-row"><span>남은 차량</span><span id="aliveCount" class="value">4</span></div>
        <div class="stat-row"><span>최고 기록</span><span id="bestScore" class="value">0</span></div>
      </div>
    </aside>

    <section class="arena-wrap">
      <canvas id="gameCanvas" width="760" height="760"></canvas>
      <div id="overlay" class="overlay">
        <div>
          <h2>BUMPER ARENA</h2>
          <p>차량을 조종해서 상대를 밖으로 밀어내세요.<br />마지막까지 살아남으면 라운드 승리입니다.</p>
        </div>
      </div>
    </section>

    <aside class="panel">
      <div class="card">
        <div class="score-row">
          <span class="player-name"><span class="dot" style="background:#38bdf8"></span>PLAYER</span>
          <span id="playerScore" class="value">0</span>
        </div>
        <div class="score-row">
          <span class="player-name"><span class="dot" style="background:#fb7185"></span>RED BOT</span>
          <span id="bot1Score" class="value">0</span>
        </div>
        <div class="score-row">
          <span class="player-name"><span class="dot" style="background:#facc15"></span>YELLOW BOT</span>
          <span id="bot2Score" class="value">0</span>
        </div>
        <div class="score-row">
          <span class="player-name"><span class="dot" style="background:#4ade80"></span>GREEN BOT</span>
          <span id="bot3Score" class="value">0</span>
        </div>
      </div>

      <div class="card">
        <p style="margin:0 0 10px;font-size:14px;font-weight:800;color:#e2e8f0;">맵 모드</p>
        <select id="arenaMode">
          <option value="circle" selected>원형 아레나</option>
          <option value="square">사각 아레나</option>
        </select>
      </div>

      <button id="startButton">게임 시작</button>
      <button id="restartButton" class="secondary">라운드 재시작</button>
      <button id="pauseButton" class="secondary">일시정지</button>
      <span class="tag">Physics / AI Bot / Knockout</span>
    </aside>
  </main>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const overlay = document.getElementById('overlay');
    const startButton = document.getElementById('startButton');
    const restartButton = document.getElementById('restartButton');
    const pauseButton = document.getElementById('pauseButton');
    const arenaModeSelect = document.getElementById('arenaMode');

    const roundEl = document.getElementById('round');
    const aliveCountEl = document.getElementById('aliveCount');
    const bestScoreEl = document.getElementById('bestScore');
    const scoreEls = [
      document.getElementById('playerScore'),
      document.getElementById('bot1Score'),
      document.getElementById('bot2Score'),
      document.getElementById('bot3Score')
    ];

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;
    const CENTER = { x: WIDTH / 2, y: HEIGHT / 2 };
    const ARENA_RADIUS = 315;
    const SQUARE_HALF = 300;

    const keys = new Set();
    let cars = [];
    let particles = [];
    let round = 1;
    let scores = [0, 0, 0, 0];
    let bestScore = Number(localStorage.getItem('bumperArenaBestScore') || 0);
    let isRunning = false;
    let isPaused = false;
    let animationId = null;
    let lastTime = 0;
    let roundEnded = false;
    let nextRoundTimer = 0;

    bestScoreEl.textContent = bestScore;

    const carTemplates = [
      { name: 'PLAYER', color: '#38bdf8', x: CENTER.x, y: CENTER.y + 170, angle: -Math.PI / 2, isPlayer: true },
      { name: 'RED BOT', color: '#fb7185', x: CENTER.x, y: CENTER.y - 170, angle: Math.PI / 2, isPlayer: false },
      { name: 'YELLOW BOT', color: '#facc15', x: CENTER.x - 170, y: CENTER.y, angle: 0, isPlayer: false },
      { name: 'GREEN BOT', color: '#4ade80', x: CENTER.x + 170, y: CENTER.y, angle: Math.PI, isPlayer: false }
    ];

    function createCars() {
      cars = carTemplates.map((template, index) => ({
        id: index,
        name: template.name,
        color: template.color,
        x: template.x,
        y: template.y,
        vx: 0,
        vy: 0,
        angle: template.angle,
        angularVelocity: 0,
        width: 42,
        height: 64,
        radius: 27,
        mass: 1,
        isPlayer: template.isPlayer,
        alive: true,
        boost: 100,
        cooldown: 0,
        eliminatedAt: null
      }));
    }

    function resetRound() {
      cancelAnimationFrame(animationId);
      createCars();
      particles = [];
      roundEnded = false;
      nextRoundTimer = 0;
      isRunning = true;
      isPaused = false;
      lastTime = 0;
      overlay.classList.add('hidden');
      pauseButton.textContent = '일시정지';
      updateHud();
      loop();
    }

    function startGame() {
      round = 1;
      scores = [0, 0, 0, 0];
      scoreEls.forEach(el => el.textContent = '0');
      resetRound();
    }

    function updateHud() {
      roundEl.textContent = round;
      aliveCountEl.textContent = cars.filter(car => car.alive).length;
      scoreEls.forEach((el, index) => el.textContent = scores[index]);
      if (scores[0] > bestScore) {
        bestScore = scores[0];
        localStorage.setItem('bumperArenaBestScore', String(bestScore));
        bestScoreEl.textContent = bestScore;
      }
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function angleTo(from, to) {
      return Math.atan2(to.y - from.y, to.x - from.x);
    }

    function normalizeAngle(angle) {
      while (angle > Math.PI) angle -= Math.PI * 2;
      while (angle < -Math.PI) angle += Math.PI * 2;
      return angle;
    }

    function isOutsideArena(car) {
      if (arenaModeSelect.value === 'circle') {
        return Math.hypot(car.x - CENTER.x, car.y - CENTER.y) > ARENA_RADIUS + car.radius * 0.65;
      }
      return (
        car.x < CENTER.x - SQUARE_HALF - car.radius ||
        car.x > CENTER.x + SQUARE_HALF + car.radius ||
        car.y < CENTER.y - SQUARE_HALF - car.radius ||
        car.y > CENTER.y + SQUARE_HALF + car.radius
      );
    }

    function addParticles(x, y, color, count = 14) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 80 + Math.random() * 180;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 0.5 + Math.random() * 0.35,
          maxLife: 0.85,
          color,
          size: 2 + Math.random() * 4
        });
      }
    }

    function updateParticles(dt) {
      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => {
        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= 0.96;
        p.vy *= 0.96;
      });
    }

    function updatePlayer(car, dt) {
      const acceleration = 520;
      const reverseAcceleration = 330;
      const turnSpeed = 3.9;
      const brakeForce = 0.88;

      if (keys.has('a') || keys.has('ArrowLeft')) car.angle -= turnSpeed * dt;
      if (keys.has('d') || keys.has('ArrowRight')) car.angle += turnSpeed * dt;

      let force = 0;
      if (keys.has('w') || keys.has('ArrowUp')) force += acceleration;
      if (keys.has('s') || keys.has('ArrowDown')) force -= reverseAcceleration;

      if (keys.has('Shift') && car.boost > 0 && force > 0) {
        force += 760;
        car.boost = Math.max(0, car.boost - 55 * dt);
        addParticles(car.x - Math.cos(car.angle) * 24, car.y - Math.sin(car.angle) * 24, '#38bdf8', 1);
      } else {
        car.boost = Math.min(100, car.boost + 18 * dt);
      }

      car.vx += Math.cos(car.angle) * force * dt;
      car.vy += Math.sin(car.angle) * force * dt;

      if (keys.has(' ')) {
        car.vx *= brakeForce;
        car.vy *= brakeForce;
      }
    }

    function updateBot(car, dt) {
      const aliveTargets = cars.filter(target => target.alive && target.id !== car.id);
      if (!aliveTargets.length) return;

      const centerDistance = Math.hypot(car.x - CENTER.x, car.y - CENTER.y);
      const danger = arenaModeSelect.value === 'circle'
        ? centerDistance > ARENA_RADIUS * 0.74
        : Math.abs(car.x - CENTER.x) > SQUARE_HALF * 0.76 || Math.abs(car.y - CENTER.y) > SQUARE_HALF * 0.76;

      let target;
      if (danger) {
        target = CENTER;
      } else {
        target = aliveTargets.sort((a, b) => distance(car, a) - distance(car, b))[0];
      }

      const desiredAngle = angleTo(car, target);
      const diff = normalizeAngle(desiredAngle - car.angle);
      const turnSpeed = 3.1;
      car.angle += clamp(diff, -turnSpeed * dt, turnSpeed * dt);

      const aggression = danger ? 500 : 430 + round * 8;
      car.vx += Math.cos(car.angle) * aggression * dt;
      car.vy += Math.sin(car.angle) * aggression * dt;
    }

    function updateCarPhysics(car, dt) {
      if (!car.alive) return;

      if (car.isPlayer) updatePlayer(car, dt);
      else updateBot(car, dt);

      const speed = Math.hypot(car.vx, car.vy);
      const maxSpeed = car.isPlayer ? 410 : 360 + round * 4;
      if (speed > maxSpeed) {
        car.vx = (car.vx / speed) * maxSpeed;
        car.vy = (car.vy / speed) * maxSpeed;
      }

      car.x += car.vx * dt;
      car.y += car.vy * dt;

      car.vx *= 0.985;
      car.vy *= 0.985;

      if (Math.abs(car.vx) + Math.abs(car.vy) > 5) {
        car.angle += car.angularVelocity * dt;
      }
      car.angularVelocity *= 0.9;

      if (isOutsideArena(car)) {
        car.alive = false;
        car.eliminatedAt = performance.now();
        addParticles(car.x, car.y, car.color, 28);
      }
    }

    function resolveCollisions() {
      for (let i = 0; i < cars.length; i++) {
        for (let j = i + 1; j < cars.length; j++) {
          const a = cars[i];
          const b = cars[j];
          if (!a.alive || !b.alive) continue;

          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const dist = Math.hypot(dx, dy);
          const minDist = a.radius + b.radius;

          if (dist > 0 && dist < minDist) {
            const nx = dx / dist;
            const ny = dy / dist;
            const overlap = minDist - dist;

            a.x -= nx * overlap * 0.5;
            a.y -= ny * overlap * 0.5;
            b.x += nx * overlap * 0.5;
            b.y += ny * overlap * 0.5;

            const relativeVx = b.vx - a.vx;
            const relativeVy = b.vy - a.vy;
            const velocityAlongNormal = relativeVx * nx + relativeVy * ny;

            if (velocityAlongNormal < 0) {
              const restitution = 0.92;
              const impulse = -(1 + restitution) * velocityAlongNormal / 2;
              const impulseX = impulse * nx;
              const impulseY = impulse * ny;

              a.vx -= impulseX;
              a.vy -= impulseY;
              b.vx += impulseX;
              b.vy += impulseY;

              a.angularVelocity -= impulse * 0.018;
              b.angularVelocity += impulse * 0.018;

              if (Math.abs(impulse) > 35) {
                addParticles((a.x + b.x) / 2, (a.y + b.y) / 2, '#e2e8f0', 8);
              }
            }
          }
        }
      }
    }

    function checkRoundEnd(dt) {
      const aliveCars = cars.filter(car => car.alive);
      if (aliveCars.length <= 1 && !roundEnded) {
        roundEnded = true;
        nextRoundTimer = 2.4;
        if (aliveCars[0]) {
          scores[aliveCars[0].id] += 1;
        }
        updateHud();
      }

      if (roundEnded) {
        nextRoundTimer -= dt;
        const winner = aliveCars[0];
        overlay.classList.remove('hidden');
        overlay.innerHTML = `
          <div>
            <h2>${winner ? winner.name + ' WINS!' : 'DRAW!'}</h2>
            <p>${nextRoundTimer > 0 ? '다음 라운드를 준비 중입니다.' : '라운드를 시작합니다.'}</p>
          </div>
        `;

        if (nextRoundTimer <= 0) {
          round += 1;
          resetRound();
        }
      }
    }

    function drawArena() {
      ctx.clearRect(0, 0, WIDTH, HEIGHT);

      const gradient = ctx.createRadialGradient(CENTER.x, CENTER.y, 30, CENTER.x, CENTER.y, 360);
      gradient.addColorStop(0, '#1e293b');
      gradient.addColorStop(0.75, '#0f172a');
      gradient.addColorStop(1, '#020617');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      ctx.save();
      ctx.translate(CENTER.x, CENTER.y);

      if (arenaModeSelect.value === 'circle') {
        ctx.beginPath();
        ctx.arc(0, 0, ARENA_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = '#334155';
        ctx.fill();
        ctx.lineWidth = 12;
        ctx.strokeStyle = '#64748b';
        ctx.stroke();
        ctx.lineWidth = 4;
        ctx.strokeStyle = 'rgba(248, 250, 252, 0.28)';
        ctx.stroke();

        for (let r = 80; r < ARENA_RADIUS; r += 80) {
          ctx.beginPath();
          ctx.arc(0, 0, r, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(148, 163, 184, 0.13)';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      } else {
        ctx.fillStyle = '#334155';
        ctx.fillRect(-SQUARE_HALF, -SQUARE_HALF, SQUARE_HALF * 2, SQUARE_HALF * 2);
        ctx.lineWidth = 12;
        ctx.strokeStyle = '#64748b';
        ctx.strokeRect(-SQUARE_HALF, -SQUARE_HALF, SQUARE_HALF * 2, SQUARE_HALF * 2);
        ctx.lineWidth = 4;
        ctx.strokeStyle = 'rgba(248, 250, 252, 0.28)';
        ctx.strokeRect(-SQUARE_HALF, -SQUARE_HALF, SQUARE_HALF * 2, SQUARE_HALF * 2);

        for (let i = -SQUARE_HALF + 75; i < SQUARE_HALF; i += 75) {
          ctx.beginPath();
          ctx.moveTo(i, -SQUARE_HALF);
          ctx.lineTo(i, SQUARE_HALF);
          ctx.moveTo(-SQUARE_HALF, i);
          ctx.lineTo(SQUARE_HALF, i);
          ctx.strokeStyle = 'rgba(148, 163, 184, 0.13)';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }

      ctx.beginPath();
      ctx.arc(0, 0, 8, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fill();
      ctx.restore();
    }

    function drawCar(car) {
      ctx.save();
      ctx.translate(car.x, car.y);
      ctx.rotate(car.angle);
      ctx.globalAlpha = car.alive ? 1 : 0.25;

      ctx.shadowColor = car.color;
      ctx.shadowBlur = car.alive ? 16 : 0;

      ctx.fillStyle = car.color;
      roundRect(-car.height / 2, -car.width / 2, car.height, car.width, 10);
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(15, 23, 42, 0.72)';
      roundRect(-8, -car.width / 2 + 5, 20, car.width - 10, 7);
      ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.fillRect(car.height / 2 - 10, -car.width / 2 + 7, 4, 8);
      ctx.fillRect(car.height / 2 - 10, car.width / 2 - 15, 4, 8);

      ctx.fillStyle = '#020617';
      ctx.fillRect(-car.height / 2 + 9, -car.width / 2 - 4, 14, 6);
      ctx.fillRect(car.height / 2 - 23, -car.width / 2 - 4, 14, 6);
      ctx.fillRect(-car.height / 2 + 9, car.width / 2 - 2, 14, 6);
      ctx.fillRect(car.height / 2 - 23, car.width / 2 - 2, 14, 6);

      ctx.restore();

      if (car.alive) {
        ctx.save();
        ctx.font = 'bold 12px Arial';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#f8fafc';
        ctx.fillText(car.name, car.x, car.y - 42);
        if (car.isPlayer) {
          ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
          ctx.fillRect(car.x - 28, car.y + 39, 56, 7);
          ctx.fillStyle = '#38bdf8';
          ctx.fillRect(car.x - 28, car.y + 39, 56 * (car.boost / 100), 7);
        }
        ctx.restore();
      }
    }

    function roundRect(x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    function draw() {
      drawArena();
      drawParticles();
      cars.forEach(drawCar);
    }

    function update(dt) {
      if (!isRunning || isPaused) return;
      cars.forEach(car => updateCarPhysics(car, dt));
      resolveCollisions();
      updateParticles(dt);
      checkRoundEnd(dt);
      updateHud();
    }

    function loop(time = 0) {
      if (!isRunning || isPaused) return;
      const dt = Math.min((time - lastTime) / 1000 || 0, 0.033);
      lastTime = time;
      update(dt);
      draw();
      animationId = requestAnimationFrame(loop);
    }

    function togglePause() {
      if (!isRunning) return;
      isPaused = !isPaused;
      if (isPaused) {
        cancelAnimationFrame(animationId);
        pauseButton.textContent = '계속하기';
        overlay.classList.remove('hidden');
        overlay.innerHTML = '<div><h2>PAUSED</h2><p>P 또는 계속하기 버튼으로 재개하세요.</p></div>';
      } else {
        lastTime = 0;
        pauseButton.textContent = '일시정지';
        overlay.classList.add('hidden');
        loop();
      }
    }

    document.addEventListener('keydown', event => {
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.code)) {
        event.preventDefault();
      }
      if (event.key.toLowerCase() === 'p') {
        togglePause();
        return;
      }
      keys.add(event.key);
    });

    document.addEventListener('keyup', event => {
      keys.delete(event.key);
    });

    window.addEventListener('blur', () => {
      keys.clear();
    });

    startButton.addEventListener('click', startGame);
    restartButton.addEventListener('click', resetRound);
    pauseButton.addEventListener('click', togglePause);
    arenaModeSelect.addEventListener('change', () => {
      if (!isRunning) draw();
    });

    createCars();
    updateHud();
    draw();
  </script>
</body>
</html>
